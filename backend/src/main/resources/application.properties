spring.application.name=uknf
# --- DATABASE CONFIG ---
spring.datasource.url=jdbc:sqlserver://mssql-local:1433;databaseName=uknf;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Database123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.validate-on-migrate=false
# --- FLYWAY ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.jdbc=DEBUG
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.data.rest.default-media-type=application/json
spring.data.rest.use-hal-as-default-json-media-type=false
spring.hateoas.use-hal-as-default-json-media-type=false